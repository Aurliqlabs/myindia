name: Verify and Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:core
      - run: npm run test:browser
      - name: Upload source build
        uses: actions/upload-artifact@v4
        with:
          name: republic-543-source
          path: |
            index.html
            game.js
            styles.css
            data/
            scripts/
            src/
            docs/
            package.json
          retention-days: 14
