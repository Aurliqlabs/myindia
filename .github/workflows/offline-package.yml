name: Offline Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare offline package
        run: |
          mkdir -p release/REPUBLIC-543
          shopt -s dotglob extglob
          cp -R !("release"|".git") release/REPUBLIC-543/
          cat > release/REPUBLIC-543/README-FIRST.txt <<'TXT'
          REPUBLIC: 543 — OFFLINE DEVELOPMENT BUILD

          WINDOWS
          1. Install Node.js LTS if it is not already installed.
          2. Double-click START_GAME.bat.
          3. Your browser opens at http://localhost:3000
          4. Keep the terminal window open while playing.
          5. Press Ctrl+C to stop.

          TERMINAL
          npm run dev

          CORE ENGINE TESTS
          npm install
          npm run test:core
          TXT

      - name: Upload offline project
        uses: actions/upload-artifact@v4
        with:
          name: REPUBLIC-543-offline
          path: release/REPUBLIC-543
          if-no-files-found: error
          retention-days: 30
